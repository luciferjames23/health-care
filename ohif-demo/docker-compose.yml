services:
  ohif:
    image: ohif/app:v3.10.1
    container_name: meridian-ohif
    volumes:
      - ./app-config.js:/usr/share/nginx/html/app-config.js:ro
    expose:
      - "80"

  gateway:
    image: nginx:alpine
    container_name: meridian-ohif-gateway
    depends_on:
      - ohif
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

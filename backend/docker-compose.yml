services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare_backend
    ports:
      - "2003:2003"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2003/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

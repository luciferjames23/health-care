services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare_backend_dev
    command: ["uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./backend:/app
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - healthcare_network

  frontend:
    image: node:20-alpine
    container_name: healthcare_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - healthcare_network

networks:
  healthcare_network:
    driver: bridge

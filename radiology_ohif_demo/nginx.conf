server {
    listen 80;
    server_name _;

    # OHIF web application
    location / {
        proxy_pass http://ohif:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Local demo and Cloudflare hosting: allow OHIF to be embedded in the Meridian React modal.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Private-Network "true" always;
    }

    # Same-origin DICOMweb proxy to the already-running Orthanc Demo PACS.
    # The demo Orthanc uses HTTP Basic authentication (orthanc/orthanc).
    location /dicom-web/ {
        proxy_pass http://host.docker.internal:8042/dicom-web/;
        proxy_http_version 1.1;
        proxy_set_header Host host.docker.internal:8042;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
    }

    # Orthanc WADO-URI compatibility endpoint, if OHIF needs it.
    location /wado {
        proxy_pass http://host.docker.internal:8042/wado;
        proxy_http_version 1.1;
        proxy_set_header Host host.docker.internal:8042;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_buffering off;
    }
}
